name: Feature request
description: Something Burrow should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The situation
      description: What you were doing when you wanted this, on the phone.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What it could do
      description: A rough shape is enough. If omp's RPC already carries the data, say which command.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is not a terminal emulator request (Termux plus mosh already covers that).
          required: false
        - label: This does not need hunk level git editing on a 360 px screen.
          required: false
